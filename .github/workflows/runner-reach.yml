name: Public hosted runner probe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: RUNNER_REACHED public probe
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: RUNNER_REACHED
        run: |
          echo "RUNNER_REACHED=true"
          echo "runner_os=${RUNNER_OS}"
          echo "runner_arch=${RUNNER_ARCH}"
          echo "github_sha=${GITHUB_SHA}"
          echo "github_run_id=${GITHUB_RUN_ID}"
          uname -a || true
